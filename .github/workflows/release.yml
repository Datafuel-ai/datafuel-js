name: Release
on:
  push:
    tags: ["sdk-v*", "mcp-v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ startsWith(github.ref_name, 'sdk-v') && 'sdk' || 'mcp' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.resolve.outputs.package }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.published.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          git rev-parse --verify -q origin/main >/dev/null || { echo "::error::origin/main was not fetched"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            sdk-v*) dir=packages/sdk ;;
            mcp-v*) dir=packages/mcp ;;
            *) echo "::error::unknown tag $TAG"; exit 1 ;;
          esac
          name=$(node -p "require('./$dir/package.json').name")
          version=$(node -p "require('./$dir/package.json').version")
          if [ "${TAG#*-v}" != "$version" ]; then
            echo "::error::tag $TAG does not match $name@$version in $dir/package.json"
            exit 1
          fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          {
            echo "package=$name"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - id: published
        env:
          PACKAGE: ${{ steps.resolve.outputs.package }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if ! out=$(npm view "$PACKAGE@$VERSION" version 2>"$RUNNER_TEMP/view.log"); then
            grep -q E404 "$RUNNER_TEMP/view.log" || { cat "$RUNNER_TEMP/view.log"; exit 1; }
          fi
          if [ -n "$out" ]; then
            echo "::notice::$PACKAGE@$VERSION is already on npm, skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.resolve.outputs.package == '@datafuel/mcp'
        run: |
          range=$(node -p "require('./packages/mcp/package.json').dependencies['@datafuel/sdk']")
          if ! out=$(npm view "@datafuel/sdk@$range" version 2>"$RUNNER_TEMP/view.log"); then
            grep -q E404 "$RUNNER_TEMP/view.log" || { cat "$RUNNER_TEMP/view.log"; exit 1; }
          fi
          if [ -z "$out" ]; then
            echo "::error::no published @datafuel/sdk satisfies $range; release the SDK first (tag sdk-v<version>)"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - if: steps.published.outputs.publish == 'true'
        env:
          PACKAGE: ${{ steps.resolve.outputs.package }}
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack -w "$PACKAGE" --pack-destination "$RUNNER_TEMP/pack"
      - if: steps.published.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tarball
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - env:
          PACKAGE: ${{ needs.verify.outputs.package }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
        run: |
          got=$(tar -xOzf ./*.tgz package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); p.name + "@" + p.version')
          [ "$got" = "$PACKAGE@$VERSION" ] || { echo "::error::tarball is $got, expected $PACKAGE@$VERSION"; exit 1; }
          npm publish ./*.tgz --ignore-scripts --access public --tag "$TAG"
